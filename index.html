<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f6f7f9">
    <title>Asama — Agent network</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <svg class="icon-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></symbol>
      <symbol id="i-network" viewBox="0 0 24 24"><circle cx="6" cy="12" r="2.4"/><circle cx="18" cy="6" r="2.4"/><circle cx="18" cy="18" r="2.4"/><path d="m8.2 10.9 7.5-3.8M8.2 13.1l7.5 3.8"/></symbol>
      <symbol id="i-cpu" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2.5v3M15 2.5v3M9 18.5v3M15 18.5v3M2.5 9h3M2.5 15h3M18.5 9h3M18.5 15h3M10 10h4v4h-4z"/></symbol>
      <symbol id="i-users" viewBox="0 0 24 24"><path d="M16 20v-1.6a3.4 3.4 0 0 0-3.4-3.4H7.4A3.4 3.4 0 0 0 4 18.4V20"/><circle cx="10" cy="8" r="3.5"/><path d="M16 4.7a3.5 3.5 0 0 1 0 6.7M20 20v-1.6a3.4 3.4 0 0 0-2.5-3.3"/></symbol>
      <symbol id="i-spark" viewBox="0 0 24 24"><path d="m12 3 1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3Z"/><path d="m19 15 .9 2.1L22 18l-2.1.9L19 21l-.9-2.1L16 18l2.1-.9L19 15Z"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 4.5 4.5"/></symbol>
      <symbol id="i-bell" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></symbol>
      <symbol id="i-arrow-up" viewBox="0 0 24 24"><path d="M12 19V5m-6 6 6-6 6 6"/></symbol>
      <symbol id="i-message" viewBox="0 0 24 24"><path d="M20 11.5a7.5 7.5 0 0 1-7.5 7.5H6l-3 2v-6a7.5 7.5 0 1 1 17-3.5Z"/></symbol>
      <symbol id="i-send" viewBox="0 0 24 24"><path d="m21 3-7.5 18-3.8-7.7L2 9.5 21 3Z"/><path d="M9.7 13.3 21 3"/></symbol>
      <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
      <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 22s8-4 8-11V5l-8-3-8 3v6c0 7 8 11 8 11Z"/><path d="m9 12 2 2 4-4"/></symbol>
      <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
      <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 21v-7m0-4V3m8 18v-9m0-4V3m8 18v-5m0-4V3M2 14h4m4-6h4m4 8h4"/></symbol>
      <symbol id="i-laptop" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="12" rx="2"/><path d="M2 20h20l-2-4H4l-2 4Z"/></symbol>
      <symbol id="i-hard-drive" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 15h.01M11 15h.01M3 11h18"/></symbol>
      <symbol id="i-memory" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="10" rx="2"/><path d="M7 7V4m5 3V4m5 3V4M7 17v3m5-3v3m5-3v3M7 11h2m3 0h2m3 0h1"/></symbol>
      <symbol id="i-thermometer" viewBox="0 0 24 24"><path d="M14 14.8V5a3 3 0 0 0-6 0v9.8a5 5 0 1 0 6 0Z"/><path d="M11 11v6"/></symbol>
      <symbol id="i-lock" viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3m-4 5v2"/></symbol>
      <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    </svg>

    <div class="app-shell">
      <aside class="sidebar">
        <a class="brand" href="#" aria-label="Asama home" data-view="network">
          <span class="brand-mark"><span></span><span></span><span></span><span></span></span>
          <span class="brand-name">asama<span>.</span></span>
        </a>
        <button class="workspace-switcher" type="button" data-action="workspace-menu" aria-label="Switch workspace">
          <div class="workspace-avatar">N</div>
          <div class="workspace-copy"><strong>Northstar Labs</strong><span>Workspace</span></div>
          <svg class="icon switch-chevron"><use href="#i-chevron"/></svg>
        </button>
        <div class="nav-label">WORKSPACE</div>
        <nav class="primary-nav" aria-label="Main navigation">
          <button class="nav-item active" data-view="network"><svg class="icon"><use href="#i-network"/></svg><span>Agent network</span><span class="nav-count">12</span></button>
          <button class="nav-item" data-view="hardware"><svg class="icon"><use href="#i-cpu"/></svg><span>Hardware assistant</span><span class="nav-status"></span></button>
          <button class="nav-item" data-view="agents"><svg class="icon"><use href="#i-users"/></svg><span>My agents</span></button>
          <button class="nav-item" data-view="insights"><svg class="icon"><use href="#i-grid"/></svg><span>Insights</span></button>
        </nav>
        <div class="nav-label nav-label-spaced">MANAGE</div>
        <nav class="primary-nav" aria-label="Workspace management">
          <button class="nav-item" data-view="settings"><svg class="icon"><use href="#i-sliders"/></svg><span>Settings</span></button>
          <button class="nav-item" type="button" data-action="open-guide" aria-label="Help guide"><svg class="icon"><use href="#i-spark"/></svg><span>Help guide</span></button>
        </nav>
        <div class="sidebar-bottom">
          <div class="sidebar-help">
            <div class="help-icon"><svg class="icon"><use href="#i-spark"/></svg></div>
            <strong>Need a hand?</strong>
            <p>Explore the Asama guide to get started.</p>
            <button type="button" class="text-link" data-action="open-guide">Open guide <svg class="icon"><use href="#i-arrow"/></svg></button>
          </div>
          <button class="profile-button" type="button" data-action="profile-menu">
            <span class="profile-avatar">AK</span>
            <span class="profile-details"><strong>Arjun Kapoor</strong><span>Admin</span></span>
            <svg class="icon"><use href="#i-more"/></svg>
          </button>
        </div>
      </aside>

      <main class="main-panel">
        <header class="topbar">
          <div class="breadcrumbs"><span>Northstar Labs</span><svg class="icon"><use href="#i-chevron"/></svg><strong id="breadcrumb-current">Agent network</strong></div>
          <div class="topbar-actions">
            <span class="environment-pill"><span></span> Demo environment</span>
            <button class="icon-button search-button" aria-label="Search" type="button" data-action="search"><svg class="icon"><use href="#i-search"/></svg><span>Search <kbd>⌘ K</kbd></span></button>
            <button class="icon-button notification-button" aria-label="Notifications" type="button" data-action="notifications"><svg class="icon"><use href="#i-bell"/></svg><i></i></button>
            <button class="topbar-avatar profile-top-button" type="button" aria-label="Account menu" data-action="profile-menu">AK</button>
          </div>
        </header>
        <div id="view-container" class="view-container"></div>
      </main>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <div id="modal-root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
